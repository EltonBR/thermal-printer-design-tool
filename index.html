<!DOCTYPE html>
<html>

<head>
    <title>Thermal Printer Design tool</title>
</head>
<link rel="stylesheet" type="text/css" href="./assets/css/style-base.css">
<style>
    table {
        border-collapse: collapse;
        margin-top: 5px;
        width: 100%;
    }

    table td {
        border: 1px solid rgb(0, 0, 0);
        padding: 5px;
        margin: 0px;
    }

    img {
        margin-top: 10px;
        margin-bottom: 10px;
        width: 100%;
    }

    pre {
        border: 2px solid #000;
        background-color: #eeeeee;
        padding: 2px;
        white-space: normal !important;
    }
</style>

<script>
    var EditorMode = "markdown";
    function togglePreviewMode() {
        let el = document.querySelector('.paper')
        if (el.classList.contains('design-mode')) {
            el.classList.add('preview-mode')
            el.classList.remove('design-mode')
        } else {
            el.classList.remove('preview-mode')
            el.classList.add('design-mode')
        }
    }

    function setMode(mode) {
        EditorMode = mode;
        editor.session.setMode(`ace/mode/${EditorMode}`);
        editor.setValue(editor.getValue())
    }
</script>

<body>
    <div class="page-wrapper">
        <div class="editor-wrapper">
            <div id="editor">#he</div>
        </div>
        <div class="result-wrapper">
            <div class="paper design-mode">
                <div class="printable-area">
                </div>
            </div>
        </div>
    </div>
    <br>
    <button onclick="exportarImagem()">Exportar PNG</button>
    <button id="print-button" onclick="imprimirImagem()">Imprimir</button>
    <button onclick="togglePreviewMode()">Toggle Preview Mode</button>
    MODE: <select onchange="setMode(this.value)">
        <option selected value="markdown">Markdown</option>
        <option value="html">HTML</option>
    </select>
    <script src="./assets/js/html2canvas.min.js"></script>
    <script>
        async function renderizarImagem() {
            const elemento = document.querySelector(".printable-area");
            const paperEl = document.querySelector(".paper");
            const wasPreview = paperEl.classList.contains("preview-mode");
            paperEl.classList.remove("preview-mode");
            paperEl.classList.add("design-mode");
            try {
                return await html2canvas(elemento, { backgroundColor: "#ffffff", scale: 1 });
            } finally {
                if (wasPreview) {
                    paperEl.classList.add("preview-mode");
                    paperEl.classList.remove("design-mode");
                }
            }
        }

        async function exportarImagem() {
            const canvas = await renderizarImagem();
            const link = document.createElement("a");
            link.download = "div-como-imagem.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        async function imprimirImagem() {
            const button = document.querySelector("#print-button");
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            button.disabled = true;
            button.textContent = "Imprimindo...";
            try {
                const canvas = await renderizarImagem();
                const image = await new Promise((resolve, reject) =>
                    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Falha ao gerar PNG")), "image/png")
                );
                const response = await fetch("/api/print", {
                    method: "POST",
                    headers: { "Content-Type": "image/png" },
                    body: image,
                    signal: controller.signal
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Falha ao imprimir");
                button.textContent = "Enviado";
            } catch (error) {
                const message = error.name === "AbortError"
                    ? "A impressora não respondeu em 10 segundos"
                    : error.message;
                alert(message);
                button.textContent = "Imprimir";
            } finally {
                clearTimeout(timeout);
                button.disabled = false;
                setTimeout(() => { button.textContent = "Imprimir"; }, 1500);
            }
        }
    </script>
    <script src="./assets/js/ace/ace.js"></script>
    <script src="./assets/js/showdown.min.js"></script>
    <script>
        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode(`ace/mode/${EditorMode}`);
        var converter = new showdown.Converter()
        converter.setOption("tables", true)
        editor.on("change", () => {
            if (EditorMode === 'markdown') {
                const text = editor.getValue()
                const html = converter.makeHtml(text);
                document.querySelector(".printable-area").innerHTML = html;
            } else {
                document.querySelector(".printable-area").innerHTML = editor.getValue();
            }
        })
        editor.setValue(`#markdown mode`);
    </script>
</body>

</html>
